name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported runner, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config glslang-tools \
            libvulkan-dev libwayland-dev wayland-protocols libxcb1-dev libxcb-randr0-dev libdrm-dev
      - name: Build and package
        run: ./package-linux.sh
      - name: Smoke test
        run: |
          dist/linux/vrrdiag --version
          dist/linux/vrrdiag --help > /dev/null
          dist/linux/vrrdiag --list-tests > /dev/null
      - name: Archive
        run: |
          VERSION=$(dist/linux/vrrdiag --version | awk '{print $2}')
          mv dist/linux "dist/bzzrt-$VERSION-linux-x86_64"
          tar -C dist -czf "bzzrt-$VERSION-linux-x86_64.tar.gz" "bzzrt-$VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: bzzrt-*-linux-x86_64.tar.gz

  arch:
    # A pacman package built with Arch's stock makepkg flags (generic x86-64), from this commit's source.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake glslang pkgconf vulkan-headers wayland-protocols \
            libdrm libxcb vulkan-icd-loader wayland
          useradd -m builder
      - name: Build package
        run: |
          VERSION=$(sed -n 's/^project(vrrdiag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          if [ "$pkgver" != "$VERSION" ]; then
            echo "packaging/aur/PKGBUILD has pkgver $pkgver, CMakeLists.txt has $VERSION"; exit 1
          fi
          mkdir /tmp/pkg
          cp packaging/aur/PKGBUILD /tmp/pkg/
          # makepkg uses this local file instead of downloading the release tag.
          git config --global --add safe.directory "$PWD"
          git archive --prefix="Bzzrt-$pkgver/" -o "/tmp/pkg/bzzrt-$pkgver.tar.gz" HEAD
          chown -R builder /tmp/pkg
          cd /tmp/pkg && su builder -c "makepkg --skipchecksums --noconfirm"
      - name: Smoke test
        run: |
          pacman -U --noconfirm /tmp/pkg/bzzrt-[0-9]*.pkg.tar.zst
          bzzrt --version
          vrrdiag --list-tests > /dev/null
          pacman -Ql bzzrt
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: /tmp/pkg/bzzrt-[0-9]*.pkg.tar.zst

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build-windows.bat
      - name: Smoke test
        shell: pwsh
        run: |
          dist\windows\vrrdiag.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Archive
        shell: pwsh
        run: |
          $v = (& dist\windows\vrrdiag.exe --version).Split(' ')[1]
          Rename-Item dist\windows "bzzrt-$v-windows-x64"
          Compress-Archive -Path "dist\bzzrt-$v-windows-x64" -DestinationPath "bzzrt-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: bzzrt-*-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: ./package-macos.sh
      - name: Shader check
        run: build-mac/metal_shader_check
      - name: Smoke test
        run: |
          file dist/macos/Bzzrt.app/Contents/MacOS/vrrdiag
          dist/macos/Bzzrt.app/Contents/MacOS/vrrdiag --version
          dist/macos/Bzzrt.app/Contents/MacOS/vrrdiag --help > /dev/null
          codesign --verify --verbose dist/macos/Bzzrt.app
          test -s dist/macos/Bzzrt.app/Contents/Resources/bzzrt.icns && file dist/macos/Bzzrt.app/Contents/Resources/bzzrt.icns
      - name: Run a short test (needs the runner's GUI session)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p logs
          dist/macos/Bzzrt.app/Contents/MacOS/vrrdiag --windowed --test stable60 --start --duration 4 \
            --exit-after --log-dir logs --vrr-min 48 --vrr-max 120
          ls -l logs
          head -20 logs/*.csv
      - name: Archive
        run: |
          VERSION=$(dist/macos/Bzzrt.app/Contents/MacOS/vrrdiag --version | awk '{print $2}')
          mv dist/macos "dist/bzzrt-$VERSION-macos-arm64"
          ditto -c -k --keepParent "dist/bzzrt-$VERSION-macos-arm64" "bzzrt-$VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: bzzrt-*-macos-arm64.zip
